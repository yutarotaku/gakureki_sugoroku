function renderSetup(){return `<section class="panel"><h2>ゲーム設定</h2><p><strong>上級AI3人との対戦</strong>を選ぶと、あなたがプレイヤー1を操作し、残り3人は自動で進みます。従来の1〜4人手動モードも選択できます。オフライン動作です。</p><div class="setup-row"><label>プレイ形式<select id="setupOpponent"><option value="ai" ${SETUP.aiMode?'selected':''}>🤖 1人 vs 上級AI 3人</option><option value="manual" ${!SETUP.aiMode?'selected':''}>👥 1〜4人を手動操作</option></select></label><label>プレイヤー数<select id="setupCount" ${SETUP.aiMode?'disabled':''}>${[1,2,3,4].map(n=>`<option value="${n}" ${n===(SETUP.aiMode?4:SETUP.count)?'selected':''}>${n}人</option>`).join('')}</select></label><label>開始地点<select id="setupQuick"><option value="false" ${!SETUP.quick?'selected':''}>未就学児から（全ステージ）</option><option value="true" ${SETUP.quick?'selected':''}>高校から（操作確認用の簡易初期値）</option></select></label></div><div class="setup-row" style="margin-top:10px">${Array.from({length:SETUP.aiMode?1:SETUP.count},(_,i)=>`<label class="namefield">${SETUP.aiMode?'あなたの名前':`プレイヤー${i+1}の名前`}<input type="text" id="name${i}" maxlength="18" value="${e(SETUP.names[i])}" /></label>`).join('')}</div>${SETUP.aiMode?`<div class="ai-preview"><h3>対戦相手（全員上級AI）</h3><p><strong>AI① 私立重点：</strong>得意科目3つを伸ばし、効率的な私立併願を狙う</p><p><strong>AI② 国立挑戦：</strong>多科目育成を重視し、条件を見て私立へ切り替える</p><p><strong>AI③ 柔軟型：</strong>青春・模試・合格確率を見ながら行動を調整する</p></div>`:''}<div class="row" style="margin-top:16px"><button class="primary" data-act="start">${SETUP.aiMode?'上級AI3人と対戦開始':'ゲーム開始'}</button>${hasSavedGame()?'<button data-act="resume">前回のゲームを再開</button>':''}</div><div class="notice warn"><strong>テストプレイ用のAI</strong><div class="micro">シナリオCの81大学の合格条件を利用し、期待得点・合格確率の近似で行動します。未来のサイコロの出目は参照しません。既存の手動プレイ・1手戻す・保存機能も利用できます。</div></div></section>`}

function avatar(p){return `<span class="avatar p${p.id+1}" title="${e(p.name)}">${p.id+1}</span>`}
function boardTiles(boardName){let arr=BOARD_DATA[boardName],activeP=G.screen==='play'?active():null;
 return `<div class="board" data-board="${e(boardName)}">${arr.map((t,i)=>{let occupants=G.players.filter(p=>p.board===boardName&&p.pos===i&& (G.stage!==4||p.ronin));return `<div class="tile ${t.type}${activeP?.board===boardName&&activeP.pos===i?' current':''}" title="${e(labelTile(t))}"><span class="num">${i+1}${[6,13].includes(i)&&boardName.startsWith('high_')?' ◇':''}</span><span class="name">${e(labelTile(t))}</span><span class="players">${occupants.map(avatar).join('')}</span></div>`}).join('')}</div>`}
function subjectInfo(p){return `<div class="readout">${SUB.map(s=>`<div><div class="micro">${s}</div><strong>${p.stats[s]}</strong><div class="micro">${dieName(p,s)}</div></div>`).join('')}</div>`}
function skillSlots(p){return `<div class="cards">${[0,1].map(i=>{let a=p.cards[i];return `<div class="cardinfo ${a&&NEG.includes(a.name)?'negative':a&&ONESHOT.includes(a.name)?'consumable':''}">${a?`<strong>${e(a.name)} ${a.stack>1?'×'+a.stack:''}</strong><div class="micro">${e(CARD_DESC[a.name])}</div>`:`<strong>空きスキル枠 ${i+1}</strong><div class="micro">カードをドローすると使える</div>`}</div>`}).join('')}</div><p class="micro">気質専用枠：<strong>${e(p.trait)}</strong> — ${e(TRAITS[p.trait])}</p>`}
function playerPanel(p,compact=false){return `<section class="panel"><div class="titleline"><h2>${avatar(p)} ${e(p.name)} ${compact?'':'のステータス'}</h2><span class="pill">予算 ${p.money} / 青春 ${p.youth}個（${youthScore(p.youth)}点）</span></div>${subjectInfo(p)}<div class="micro" style="margin-top:8px">家庭：${['両親非大卒','親1人が大卒','両親大卒'][p.edu]} ／ ${['低','中','高'][p.income]}所得 ／ 得意${p.gift}・苦手${p.weak}</div>${compact?'':`<hr class="sep"><h3>カード</h3>${skillSlots(p)}`} </section>`}
function moveCards(p){if(G.screen!=='play'||!['move','afterStop'].includes(G.phase))return '';
 let eligible=p.cards.filter(c=>['ノート隠し','足止め','合同勉強会','模試の情報交換','文化祭の共同企画','才能開花'].includes(c.name));
 return eligible.length?`<div class="route-note"><div class="mini-label">使い切りカード（1ターン1枚まで）</div><div class="choice">${eligible.map(c=>`<button class="small" data-act="cardStart" data-val="${e(c.name)}" ${p.usedConsumable||(G.players.length<=1&&c.name!=='才能開花')?'disabled':''}>${e(c.name)}</button>`).join('')}</div></div>`:''}
function playControls(){let p=active();if(G.phase==='move')return `<div class="notice"><strong>${p.ai?'🤖 上級AI：':''}${e(p.name)}の番です。</strong> 移動d6を振ります。${moveCards(p)}<button class="primary wide" data-act="roll">🎲 移動ダイスを振る</button></div>`;
 if(G.phase==='adjustMove')return `<div class="notice">移動出目：<strong>${G.remaining}</strong>。永続カード「進路の先読み」を使えます。<div class="choice"><button data-act="adjust" data-val="-1">−1に変更</button><button data-act="adjust" data-val="0">変更しない</button><button data-act="adjust" data-val="1">＋1に変更</button></div></div>`;
 if(G.phase==='choosePath')return `<div class="notice"><strong>残り${G.remaining}歩。進む方向を選択してください。</strong><div class="stack" style="margin-top:9px">${moveOptions().map((op,i)=>`<button class="path-btn" data-act="path" data-val="${i}">${e(op.label)}</button>`).join('')}</div><p class="micro">この移動ロールではボード間の往復はできません。</p></div>`;
 if(G.phase==='studyPick'){let t=G.study,boostEnabled=has(p,'青春の底力')&&p.youth>=3;return `<div class="notice"><h3>${t.k}回分の学習を割り当ててください（${t.selected.length}/${t.k}）</h3><p class="micro">${[3,4].includes(G.stage)?'高校・浪人では同じ科目を2回まで選択可能。':'小中学校では各科目を1回ずつ学習。'} 各学習ダイスは独立に振ります。</p><div class="stack">${SUB.map(s=>{let c=t.selected.filter(x=>x===s).length,max=[3,4].includes(G.stage)?2:1;return `<div class="statline"><strong>${s}</strong><span>${dieName(p,s)}／能力${p.stats[s]}</span><span>選択${c}回</span><button class="small" data-act="toggleSub" data-val="${s}|remove" ${c===0?'disabled':''}>−</button><button class="small" data-act="toggleSub" data-val="${s}|add" ${c>=max||t.selected.length>=t.k?'disabled':''}>＋</button></div>`}).join('')}</div>${boostEnabled?`<div class="route-note"><strong>青春の底力：成長2倍の対象を選択</strong><p class="micro">青春トークン3個以上で各学習マスに常時発動。選択した1科目の学習結果をすべて2倍にします（能力値上限20）。</p><div class="chips">${[...new Set(t.selected)].map(s=>`<button class="${t.boostSub===s?'selected':''}" data-act="studyBoost" data-val="${s}">${s}${t.boostSub===s?' ✓':''}</button>`).join('')}</div></div>`:''}${t.quiz?'<p class="micro">フラッシュカード付き：学習する科目からランダムに1科目を出題します。</p>':''}<div class="row" style="margin-top:12px">${has(p,'追加履修券')&&!p.usedConsumable&&t.k<5?'<button data-act="extraStudy">追加履修券で+1回</button>':''}<button class="primary" data-act="studyConfirm" ${t.selected.length!==t.k||boostEnabled&&!t.boostSub?'disabled':''}>成長ダイスを振る</button></div></div>`}
 if(G.phase==='quiz'){let q=G.quiz,expired=q.expired||Date.now()>q.deadline;return `<div class="notice"><h3>📋 ${q.sub} フラッシュカード <span id="clock" class="pill">残り${Math.max(0,Math.ceil((q.deadline-Date.now())/1000))}秒</span></h3><p style="font-size:17px">${e(q.question)}</p>${q.revealed?`<strong>正答：${e(q.answer)}</strong><div class="choice" style="margin-top:10px"><button class="green" data-act="quizDone" data-val="yes" ${expired?'disabled':''}>正解だった</button><button data-act="quizDone" data-val="no">不正解／時間切れ</button></div>`:`<p class="micro">口頭・頭の中で回答し、制限時間内に解答を表示してください。</p><button class="primary" data-act="quizReveal">解答を表示</button>`}</div>`}
 if(G.phase==='eventChoice'){let tile=G.pendingTile,desc=labelTile(tile);return `<div class="notice"><h3>${e(desc)}に停止しました</h3><p class="micro">${tile.type==='youth'?'青春イベントでは塾・予備校は利用できません。':tile.type==='event'?'このマスは休息（効果なし）です。資金があれば代わりに塾・予備校を利用できます。':'マスの効果を処理するか、効果を放棄して塾・予備校を利用します。'}</p><div class="choice"><button class="primary" data-act="eventChoice" data-val="event">${tile.type==='event'?'休息して次へ':'マスの効果を処理'}</button>${G.stage!==0&&tile.type!=='youth'&&payTutorPossible(p)?'<button data-act="eventChoice" data-val="tutor">塾・予備校を利用</button>':''}</div></div>`}
 if(G.phase==='traitDraw')return `<div class="notice"><h3>気質カードをドロー</h3><p>現在：<strong>${e(p.trait)}</strong>　→　ドロー：<strong>${e(G.pendingDraw.name)}</strong></p><p class="micro">${e(TRAITS[G.pendingDraw.name])}</p><div class="choice"><button class="primary" data-act="traitDraw" data-val="yes">気質を入れ替える</button><button data-act="traitDraw" data-val="no">破棄して現状維持</button></div></div>`;
 if(G.phase==='cardReplace')return `<div class="notice"><h3>通常2枠が埋まっています</h3><p>新カード：<strong>${e(G.pendingDraw.name)}</strong> — ${e(CARD_DESC[G.pendingDraw.name])}</p><p class="micro">既存カードの1枚を破棄して入れ替えるか、今回引いたカードを破棄します。カードを引かずに永続カードを捨てることはできません。</p><div class="stack">${p.cards.map((c,i)=>`<button data-act="cardReplace" data-val="${i}">「${e(c.name)}」を破棄して取得</button>`).join('')}<button data-act="cardReplace" data-val="skip">新カードを捨てる</button></div></div>`;
 if(G.phase==='cardRankPick')return `<div class="notice"><h3>才能開花：強化する科目を選んでください</h3><p class="micro">使い切りカードを1枚消費し、選んだ科目の成長ダイスを恒久的に1ランク上げます。</p><div class="choice">${SUB.map(s=>`<button data-act="cardRank" data-val="${s}" ${p.tiers[s]>=4?'disabled':''}>${s} ${dieName(p,s)} → ${p.tiers[s]<4?'d'+SIDES[p.tiers[s]+1]:'上限'}</button>`).join('')}</div><button class="small" data-act="cancelCard">キャンセル</button></div>`;
 if(G.phase==='cardTarget')return `<div class="notice"><h3>${e(G.pendingCard.name)}の対象プレイヤーを選択</h3><div class="choice">${G.players.filter(x=>x.id!==G.pendingCard.owner).map(x=>`<button data-act="cardTarget" data-val="${x.id}">${e(x.name)}</button>`).join('')}</div><button class="small" data-act="cancelCard">キャンセル</button></div>`;
 if(G.phase==='cardConsent')return `<div class="notice"><h3>協調カード：相手の同意が必要です</h3><p>${e(G.players[G.pendingCard.target].name)}さん、「${e(G.pendingCard.name)}」の協力を受け入れますか？</p><div class="choice"><button class="green" data-act="consent" data-val="yes">同意する</button><button data-act="consent" data-val="no">断る</button></div></div>`;
 if(G.phase==='tutorPick')return `<div class="notice"><h3>塾・予備校：任意の1科目を育成</h3><p class="micro">通常は資金1を消費。予備校優待や塾の無料券が有効なら無料です。</p><div class="choice">${SUB.map(s=>`<button data-act="tutorSub" data-val="${s}">${s}／${dieName(p,s)}／能力${p.stats[s]}</button>`).join('')}</div></div>`;
 if(G.phase==='afterStop')return `<div class="notice"><strong>マスの処理が終了しました。</strong>${moveCards(p)}<div class="choice" style="margin-top:9px">${!G.tutorDone&&G.stage!==0&&G.pendingTile?.type!=='youth'&&payTutorPossible(p)?'<button data-act="requestTutor">塾・予備校（1科目／資金1）</button>':''}<button class="primary" data-act="endTurn">次のプレイヤー／ターンへ</button></div></div>`;
 return `<div class="notice">処理を確認してください。</div>`}
function renderPlay(){let p=active(),show=G.viewBoard&&BOARD_DATA[G.viewBoard]?G.viewBoard:p.board;return `<div class="row between" style="margin:8px 0 15px"><div><h2 class="section-title">${STAGENAMES[G.stage]}　第${G.round}/${STAGETURNS[G.stage]}ターン</h2><div class="micro">現在の手番：${e(p.name)}　／　${G.turn+1}/${G.order.length}人　／　${G.phase==='choosePath'?'残り移動'+G.remaining+'歩':'移動d6'}</div></div><span class="pill">高校6ターン固定</span></div>${G.aiMode?`<div class="notice ${G.aiPaused?'warn':''}">${G.aiPaused?'⏸ AIの自動進行を停止中です。再開ボタンで続けます。':aiCurrentActor()?.ai?'🤖 上級AIが自動操作中です。あなたの番になると停止します。':'👤 あなたの手番です。AI3人は自動で行動します。'}${G.aiError?`<p class="failure">${e(G.aiError)}</p>`:''}</div>`:''}<div class="grid"><div><section class="panel"><div class="row between"><h2>盤面：${SCNAMES[show]}</h2><select id="boardView"><option value="">現在地を表示</option>${Object.keys(BOARD_DATA).map(k=>`<option value="${k}" ${show===k&&G.viewBoard===k?'selected':''}>${SCNAMES[k]}</option>`).join('')}</select></div>${boardTiles(show)}<p class="micro" style="margin:10px 0 0">青枠は手番プレイヤーの現在地。学校ボードの◇印では近道を選択できます。高校の放課後入口で残りの歩数を使って共通ボードへ移動可能。</p></section><section class="panel"><h2>ゲーム進行</h2>${playControls()}</section><section class="panel"><h2>直近の履歴</h2>${historyBox()}</section></div><div>${playerPanel(p)}<section class="panel"><h2>ほかのプレイヤー</h2>${G.players.filter(x=>x.id!==p.id).map(x=>`<div class="statline">${avatar(x)}<span>${x.ai?'🤖 ':''}${e(x.name)}${x.aiReason?`<small class="ai-reason">${e(x.aiReason)}</small>`:''}</span><span>学力合計${SUB.reduce((a,s)=>a+x.stats[s],0)}／青春${x.youth}</span></div>`).join('')||'<p class="micro">1人プレイ中です。</p>'}</section></div></div>`}
function historyBox(){return `<div class="log">${(G.history||[]).slice(0,24).map(x=>`<p><span class="muted">${e(x.when)}：</span>${e(x.msg)}</p>`).join('')}</div>`}
function renderRank(){let p=G.players[G.rankQueue[0]];return `<section class="panel"><h2>成長ダイスのランクアップ</h2><p>${e(p.name)}は今ステージの強化抽選に成功しました。ランクアップする科目を1つ選んでください。</p>${playerPanel(p,true)}<div class="choice">${SUB.map(s=>`<button data-act="rank" data-val="${s}" ${p.tiers[s]>=4?'disabled':''}>${s} ${dieName(p,s)}→${p.tiers[s]>=4?'上限':`d${SIDES[p.tiers[s]+1]}`}</button>`).join('')}</div><p class="micro">この画面は旧仕様のため通常は表示されません。</p></section>`}
function renderSchoolExam(){let v=G.pendingSchool,p=schoolP();if(!p)return '';
 let middle=v.type==='middle';return `<section class="panel"><h2>${middle?'中学受験':'高校受験'}：${e(p.name)}</h2><div class="notice">${middle?'国語・数学・理科・社会の4科目':'国語・数学・英語・理科・社会の5科目'}について、<strong>能力値＋各科目の成長ダイスの出目</strong>を合計して合格を判定します。出願時点の能力値はそのまま、ダイスは1回ずつ独立に振ります。</div>${playerPanel(p,true)}<hr class="sep">${v.last?`<h3>${e(SCNAMES[v.last.kind])}の結果</h3>${v.last.default?'<p>公立の一般校へ進学（入試不要）。</p>':`<p class="${v.last.passed?'success':'failure'}"><strong>${v.last.scholarship?'特待合格':v.last.passed?'合格':'不合格'}</strong>／合計${v.last.score}点・合格ライン${v.last.cutoff}${v.last.paid?`／受験費用2（${v.last.scholarship?'特待により全額返還':'返金なし'}）`:''}</p>${examFaces(p,v.last.subjects,v.last.faces)}` }<p>進学先：<strong>${SCNAMES[middle?p.middle:p.school]}</strong></p><button class="primary" data-act="schoolNext">次のプレイヤーへ</button>`:
 `<h3>受験先を選択</h3><div class="choice">${middle?`<button data-act="schoolApply" data-val="midpub">公立中学校（無試験）</button><button data-act="schoolApply" data-val="midpri" ${p.money<2?'disabled':''}>私立中学校（合格${G.schoolCut.middle}・特待${G.schoolCut.middle+10}／受験時に資金2）</button>`:`<button data-act="schoolApply" data-val="high_coed">公立共学校（無試験）</button><button data-act="schoolApply" data-val="high_public">公立進学校（ライン${G.schoolCut.high_public}／無料）</button><button data-act="schoolApply" data-val="high_private" ${p.money<2?'disabled':''}>私立進学校（合格${G.schoolCut.high_private}・特待${G.schoolCut.high_private+12}／受験時に資金2）</button>`}</div><p class="micro">入試難度の数値は、合計点方式への移行に伴う暫定値です。私立学校の受験費用は不合格でも返還されません。中学はライン+10、高校は+12で特待となり全額返還されます。</p>`}</section>`}
function examFaces(p,subjects,faces,w={}){return `<div class="scroll-x"><table class="uni-table"><thead><tr><th>科目</th><th>能力値</th><th>ダイス</th><th>出目</th><th>配点係数</th><th>得点</th></tr></thead><tbody>${subjects.map(s=>`<tr><td>${s}</td><td>${p.stats[s]}</td><td>d${SIDES[faces[s].tier]}</td><td>${faces[s].face}</td><td>×${w[s]||1}</td><td>${(p.stats[s]+faces[s].face)*(w[s]||1)}</td></tr>`).join('')}</tbody></table></div>`}

function renderMockExam(){
 let m=G.mock,p=mockP(),selected=m.choices,filter=m.filter||'all',query=(m.search||'').trim().toLowerCase(),filtered=UNIS.map((u,i)=>({u,i})).filter(({u,i})=>(filter==='all'||filter==='national'&&u.cost===0||filter==='private'&&u.cost===1||filter==='high'&&u.points>=15||filter==='selected'&&selected.includes(i))&&(!query||u.name.toLowerCase().includes(query)));

function ruleContent(){return `<div class="rules"><p><strong>目的：</strong>出生から大学受験まで進み、大学得点、青春得点、家庭期待、浪人の減点を合計して順位を争います。最大4人、同一端末での交代制、または人間1人対上級AI3人の対戦が可能です。AIはオフラインで判断し、ゲーム内で学習・受験・カード使用を自動進行します。AI一時停止や速度変更は上部のボタンで行います。</p>
<h3>ターンとマス</h3><p>テストプレイ用の「↶ 1手戻す」は直前のボタン操作を取り消します。最大40操作分。戻したあとにもう一度ダイスを振ると出目は変わることがあります。</p><p>未就学児2、小学校6、中学校6、高校6、浪人3ターン。移動はd6。学習マスでは表示された回数分だけ科目を選び、各回で成長ダイスを振ります。高校・浪人は同一科目を1マス2回まで選択可能。小中学校は同一科目の重複不可。出目1〜2で成長0、3〜5で+1、6以上で+2、各科目の上限は20。未就学児期はスキルカードと青春イベントのマスのみで、学習マスはありません。学習マス以外では無料の学習はできません。</p>
<p>フラッシュカード付き学習マスは、選択した科目から1科目をランダムに出題。10秒以内の正解でその科目の成長ダイスだけ一時的に1段階強化。正誤は自己申告です。青春イベントマスでは塾・予備校を一律利用できません。休息マスは効果なしで、資金1の塾を選択できます。スキルマス等でもマスの効果と塾を選択でき、学習マスでは処理後に塾を追加利用できます。</p>
<h3>出生・資金</h3><p>全科目0から開始し、親の大学卒人数に応じて0〜2科目に初期学力+1。得意d8、普通d6、苦手d4から開始します。家計の低・中・高に応じて各ステージ開始時に資金2・3・4を支給（持ち越し可）。私立中高は受験した時点で資金2（不合格でも返金なし）。特待合格（中学合格点+10、高校+12）で全額返還。塾1、私立大学の出願1を消費します。</p>
<h3>成長ダイス強化</h3><p>ランダムの自動ランクアップは廃止しました。使い切りカード「才能開花」を使用すると好きな1科目のダイスを1段階強化できます。d4→d6→d8→d10→d12まで。</p>
<h3>放課後7マス</h3><p>高校の学校ボードの「放課後マス」から、移動ダイスの残り歩数を使って1マス目に進入。1・3・7マス目が出口で、3・7マス目は止まれば青春イベントも発生します。7を越えられない場合は停止して次の手番で帰還。同じ移動ロールで学校→放課後→学校、あるいは放課後→学校→放課後と往復することはできません。</p>
<h3>スキルカード</h3><p>通常2枠＋出生時気質専用1枠。永続スキルは原則1ステージ1回、ただし「文理横断の学習」は<strong>各学習マスで毎回</strong>有効。1枚で選択科目+1、同名カードを2枚重ねると+2（1枠・最大5科目）。その他の永続スキルは重複不可。「青春の底力」は青春3個以上で毎回1科目の学習結果を2倍（塾を除く）。永続スキルは自由に捨てられませんが、新しいカードを引いたときは既存のカードを破棄して交換可。デメリットは強制取得で、満枠ならランダムに1枠置換します。使い切りカードは1ターン最大1枚です。</p>
<p>攻撃・協調カードは相手の手番外でも効果が残ります。協調は対象プレイヤーの同意が必要です。気質は全員最初から1枚、通常のスキルと同じ山札に個別の気質カードを混ぜ、引いた場合は交換可能。疲労・部活実績・スポーツ推薦は廃止しました。</p>
<h3>中学・高校入試（今回の変更）</h3><p>中学：国数理社の4科目、高校：5科目について、<strong>各科目の能力値＋その科目の成長ダイス1回の生の出目</strong>を合計し、受験先ごとの合格ライン以上なら合格。中高の合格ラインは（私立中${G?.schoolCut?.middle??27}、公立進学校${G?.schoolCut?.high_public??33}、私立進学校${G?.schoolCut?.high_private??46}）。公立中学・公立共学校は無試験で選択可能。</p>
<h3>大学入試</h3><p>最大6校、うち国公立は最大2校。国公立は一次として5科目の文理別最低能力値（文系は理科-2、理系は社会-2）を満たす必要があり、2校目は各科目の基準+1。私立は足切りなし。二次・私立は対象科目の能力値＋各科目の成長ダイスの出目を大学別の係数で傾斜し合計。入試ダイスの振り直しは1大学の同じ科目につき最大1回。大学の難度・科目・点数はゲーム用の仮設定で、現実の入試を正確に表すものではありません。</p>
<h3>高校3ターン目の模試</h3><p>3ターン終了後に全員最大3校を無料で仮受験。模試に限って国公立も最大3校選択可能で、2校目と3校目は後期候補として足切り+1を適用。成績差を表示し、資金・カード・永続スキルの使用回数・本番の合格結果には影響しません。</p><h3>青春・浪人</h3><p>青春イベント1回につき原則1トークン。3個以上で4点、以降は1個増えるたび+1点。浪人すると現役合格校をすべて放棄し、青春トークン1個を没収、最終得点-2。浪人後に現役で合格していた同じ大学へ再合格し進学した場合は追加-2。どの大学も出願できない場合は出願せず浪人または終了を選べます。</p>

function aiSay(p,msg){p.aiReason=msg;}
const aiMeanDie=(p,s)=> (SIDES[p.tiers[s]]+1)/2;
const aiVarianceDie=(p,s)=> (SIDES[p.tiers[s]]**2-1)/12;
function aiNormalCDF(x){
 // Abramowitz & Stegun approximation, max error ~8e-8.
 let z=Math.abs(x), t=1/(1+0.2316419*z);
 let q=Math.exp(-z*z/2)/Math.sqrt(2*Math.PI)*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
 return x>=0?1-q:q;
}
function aiPassChance(p,u,natIndex=0,forecast=0){
 if(!u.cost&&SUB.some(s=>p.stats[s]+forecast<(u.min[s]??0)+(natIndex>0?1:0)))return 0;
 let mean=0,variance=0;
 for(let s of u.subs){const weight=u.w[s]??1;mean+=(p.stats[s]+forecast+aiMeanDie(p,s))*weight;variance+=aiVarianceDie(p,s)*weight**2;}
 // Continuity correction for mostly-integer sums, use small softness in extreme cases.
 let prob=1-aiNormalCDF((u.cut-mean-0.30)/Math.sqrt(Math.max(0.05,variance)));
 return Math.max(0.000001,Math.min(0.999999,prob));
}
function aiValue(p,u){return u.points+(p.edu===0&&u.points>=15?2:0)-(p.edu===2&&u.points<14?2:0);}
function aiFocus(p){
 if(p.aiFocus?.length===3)return p.aiFocus;
 const sorted=SUB.slice().sort((a,b)=>(p.tiers[b]-p.tiers[a])||a.localeCompare(b));

 p.aiFocus=focus;return focus;
}

 if(p.aiStyle==='private')return 0;

 let strength=SUB.reduce((x,s)=>x+p.stats[s],0)/5;
 let lowest=Math.min(...SUB.map(s=>p.stats[s]));
 let rest=G.stage===1?12:G.stage===2?6:G.stage===3?Math.max(0,6-G.round):2;

 // Only maintain broad schooling when it remains plausible, esp. in high school.

 if(G.stage>=3&&lowest+0.70*rest<cutoff)tendency*=0.38;

}
function aiLearnWeight(p,s){
 let focus=aiFocus(p),nat=aiNationalInclination(p),mean=aiMeanDie(p,s),current=p.stats[s];
 let schoolRemainder=Math.max(0,G.stage===1?12:G.stage===2?6:G.stage===3?6-G.round:3);
 let broad=nat*(1.0+0.5*Math.max(0,6-current)/6)+0.11;
 let spec=(1-nat)*(focus.includes(s)?2.20:0.13);
 let need=nat>0.35&&current<Math.min(9,5+schoolRemainder*0.30)?0.75*nat:0;
 let cardBonus=has(p,'青春の底力')&&p.youth>=3?0.22:0;
 // After the halfway mock, weight subjects used in the chosen reachable target.
 let mockPriority=0;
 if(G.stage===3&&G.round>=4&&p.aiMockTarget){
   const target=UNIS.find(u=>u.name===p.aiMockTarget);
   if(target&&target.subs.includes(s)){
     const deficit=target.cut-target.subs.reduce((total,q)=>total+(p.stats[q]+aiMeanDie(p,q))*(target.w[q]??1),0);
     if(deficit>0&&deficit<28)mockPriority=0.43*(target.w[s]??1);
     else if(deficit<=0&&deficit>-12)mockPriority=0.10*(target.w[s]??1);
   }
 }
 return (broad+spec+need+cardBonus+mockPriority)*(mean>=3?1:0.92)*Math.max(0.015,(20-current)/20);
}

function aiStudyPlan(p,k){

 }

}

function aiProjectedLanding(p,delta,op=null){
 let board=p.board,pos=p.pos,switched=G.switchedRoll;
 let remaining=Math.max(0,G.remaining+delta);
 if(op){remaining=Math.max(0,remaining-1);if(op.type==='step')pos=op.to;else if(op.type==='enter'){board='after';pos=0;switched=true;}else if(op.type==='exit'){board=p.school;pos=p.lastPortal;switched=true;}}
 while(remaining>0){
  if(board==='after'){
   if(pos>=6)break;
   // In simulation, choose the return path when it appears more useful.
   if([0,2].includes(pos)&&!switched&&aiTileValue(p,BOARD_DATA[p.school][p.lastPortal])>aiTileValue(p,BOARD_DATA.after[Math.min(pos+1,6)])+0.3){board=p.school;pos=p.lastPortal;switched=true;}

function aiSchoolChoice(p,middle){

 const subjects=middle?['国','数','理','社']:SUB;
 const avg=subjects.reduce((a,s)=>a+p.stats[s]+aiMeanDie(p,s),0);
 const variance=subjects.reduce((a,s)=>a+aiVarianceDie(p,s),0);
 const success=1-aiNormalCDF((base-avg-0.5)/Math.sqrt(variance));
 if(middle){if(p.money<2)return 'midpub';return success>=0.33&&(p.aiStyle!=='youth'||success>0.58)?'midpri':'midpub';}
 const publicSuccess=1-aiNormalCDF((G.schoolCut.high_public-avg-0.5)/Math.sqrt(variance));
 if(p.money>=2&&success>=0.35&&(p.aiStyle!=='youth'||success>0.65))return pri;
 return publicSuccess>0.43?pub:'high_coed';
}

function aiChoosePortfolio(p,mock=false){
 let candidates=UNIS.map((u,i)=>({u,i}));
 if(mock){

  const attainable=options.filter(x=>x.prob>=0.10).sort((a,b)=>(b.fit+3*b.prob)-(a.fit+3*a.prob));
  if(attainable.length)plan.push(attainable[0].i);

 };

   const inc=E([...selected,{i,u,prob}])-current;
   const scale=u.cost?1:1.001;
   if(inc*scale>bestInc){bestInc=inc*scale;best={i,u,prob}}
  }
  if(!best)break;
  selected.push(best);funds-=best.u.cost;
 }
 return selected.map(x=>x.i);
}
function aiRankSource(p){return rerollSources(p).find(x=>x.id!=='赤本')||rerollSources(p)[0]}
function aiTargetOpponent(p){
 const others=G.players.filter(x=>x.id!==p.id);
 return others.sort((a,b)=>((b.finalPts||0)+youthScore(b.youth)+SUB.reduce((v,s)=>v+b.stats[s],0)*0.13)-((a.finalPts||0)+youthScore(a.youth)+SUB.reduce((v,s)=>v+a.stats[s],0)*0.13))[0];
}
function aiPrepCard(p){
 if(p.usedConsumable||!['move','afterStop'].includes(G.phase))return false;
 if(has(p,'才能開花')&&SUB.some(s=>p.tiers[s]<4)){
  aiSay(p,'成長ダイスを永続強化する「才能開花」を使用');cardStart('才能開花');return true;
 }
 if(['ノート隠し','足止め'].some(n=>has(p,n))&&G.stage>=2&&G.round>3){
  const nm=has(p,'足止め')?'足止め':'ノート隠し';aiSay(p,'他プレイヤーへの妨害カードを使用');cardStart(nm);return true;
 }
 if(['合同勉強会','模試の情報交換','文化祭の共同企画'].some(n=>has(p,n))){
  const nm=['合同勉強会','模試の情報交換','文化祭の共同企画'].find(n=>has(p,n));
  aiSay(p,'双方に有利な協調カードを提案');cardStart(nm);return true;
 }
 return false;
}
function aiTutorWanted(p){
 if(G.stage===0||G.pendingTile?.type==='youth'||!payTutorPossible(p)||G.tutorDone)return false;
 const availableFree=(has(p,'予備校優待')&&!used(p,'予備校優待'))||(has(p,'塾の無料券')&&!p.usedConsumable);
 if(availableFree)return true;
 const schoolReserve=G.stage<3?2:0;
 return p.money>=schoolReserve+3&&(G.stage>=2||p.aiStyle!=='youth');
}
function aiChooseReroll(p,faces,subs,w,already=[]){
 const choices=subs.filter(s=>!already.includes(s)).map(s=>({s,potential:(SIDES[p.tiers[s]]-faces[s].face)*(w[s]??1)})).sort((a,b)=>b.potential-a.potential);
 return choices[0]?.potential>0.01?choices[0].s:null;
}
function aiStep(){
 if(!aiShouldMove())return;
 let p=aiCurrentActor();
 if(G.phase==='cardConsent'){consentCard(true);return}
 if(G.screen==='schoolExam'){
  if(G.pendingSchool.last){nextSchool();return}
  const choice=aiSchoolChoice(p,G.pendingSchool.type==='middle');
  aiSay(p,`資金と合格見込みから${SCNAMES[choice]}を選択`);schoolApply(choice);return;
 }
 if(G.screen==='mockExam'){
  const m=G.mock;
  if(G.phase==='mockChoose'){
   if(!m.aiPlan)m.aiPlan=aiChoosePortfolio(p,true);
   if(m.choices.length<m.aiPlan.length){mockToggle(m.aiPlan[m.choices.length]);return}
   aiSay(p,'挑戦校・実力相応校・安全校の3校で模試');mockSubmit();return;
  }
  if(G.phase==='mockReady'){mockRoll();return}
  if(G.phase==='mockRolled'){
   const x=m.current,u=UNIS[x.uid],src=[];
   if(p.trait==='本番に強い')src.push('本番に強い');
   if(has(p,'模擬試験の達人'))src.push('模擬試験の達人');
   if(has(p,'赤本'))src.push('赤本');
   let source=src.find(t=>!x.sourcesUsed.includes(t));
   if(source&&!x.passed&&!x.floorFails.length){let sub=aiChooseReroll(p,x.faces,u.subs,u.w,x.rerolled);if(sub){mockReroll(sub+'|'+source);return}}
   mockContinue();return;
  }
  if(G.phase==='mockSummary'){
   const passes=m.results.filter(x=>x.passed);
   aiSay(p,`模試${m.results.length}校・合格判定${passes.length}校、残りの学習を調整`);
   // Alter the school objective toward the most promising mock exam when appropriate.
   if(m.results.length){const near=m.results.slice().filter(x=>x.floorFails?.length===0).sort((a,b)=>{
     const va=a.points-0.20*Math.abs(a.score-a.cutoff)+(a.score>=a.cutoff?0.7:0);
     const vb=b.points-0.20*Math.abs(b.score-b.cutoff)+(b.score>=b.cutoff?0.7:0);
     return vb-va;
   })[0];if(near)p.aiMockTarget=near.name;}
   mockNextPlayer();return;
  }
 }
 if(G.screen==='uniExam'){
  if(G.phase==='examChoose'){
   if(!G.exam.aiPlan){G.exam.aiPlan=aiChoosePortfolio(p,false);aiSay(p,`合格確率・進学得点・併願効果を比較して最大6校選択`);log(`${p.name}が入試の期待値を比較して志望校を決定`)}
   if(G.exam.choices.length<G.exam.aiPlan.length){uniToggle(G.exam.aiPlan[G.exam.choices.length]);return}
   uniSubmit();return;
  }
  if(G.phase==='examReady'){uniRoll();return}
  if(G.phase==='examRolled'){
   const x=G.exam.current,u=UNIS[x.uid],source=aiRankSource(p);
   if(!x.passed&&source){const sub=aiChooseReroll(p,x.faces,u.subs,u.w,x.rerolled);if(sub){aiSay(p,`${u.name}の${sub}の入試ダイスを振り直し`);uniReroll(sub,source.id);return}}
   uniContinue();return;
  }
  if(G.phase==='examDecision'){
   let offers=G.exam.offers.slice().sort((a,b)=>b.points-a.points),best=offers[0];
   const chanceRonin=!G.exam.ronin&&(!best||best.points<=7&&p.money>=2&&p.youth<=4);
   aiSay(p,chanceRonin?'現在の合格先と浪人後の期待値から浪人を選択':'合格先のうち得点最大の大学へ進学');
   uniDecision(chanceRonin?'ronin':'finish');return;
  }
 }
 if(G.screen==='play'){
  if(G.phase==='move'){
   if(aiPrepCard(p))return;
   aiSay(p,'移動d6を振り、到達マスと経路を比較');beginMove();return;
  }
  if(G.phase==='adjustMove'){
   const opts=[-1,0,1].map(x=>({x,val:aiProjectedLanding(p,x)})).sort((a,b)=>b.val-a.val);
   const decision=opts[0].val>aiProjectedLanding(p,0)+0.34?opts[0].x:0;
   if(decision!==0)aiSay(p,`進路の先読みで移動${decision>0?'+1':'−1'}を選択`);
   moveAdjust(String(decision));return;
  }
  if(G.phase==='choosePath'){
   const opts=moveOptions(),best=opts.map((op,i)=>({i,v:aiProjectedLanding(p,0,op)})).sort((a,b)=>b.v-a.v)[0];
   if(!best)throw Error('進路選択肢がありません');aiSay(p,`分岐を比較し、停止マスの見込みで経路${best.i+1}を選択`);choosePath(String(best.i));return;
  }
  if(G.phase==='studyPick'){
   const plan=aiStudyPlan(p,G.study.k);
   // Avoid optional extra study consumables if no more than one category available.
   if(has(p,'追加履修券')&&!p.usedConsumable&&G.study.k<5&&G.stage>=2&&G.study.selected.length===0){consumeExtraStudy();return}
   let current=G.study.selected;
   if(current.length<G.study.k){
    // Plan can include repeated subjects; add first unmet subject.
    let count={},usedC={};plan.forEach(s=>count[s]=(count[s]||0)+1);current.forEach(s=>usedC[s]=(usedC[s]||0)+1);
    let s=plan.find(q=>(usedC[q]||0)<(count[q]||0));if(!s)throw Error('学習科目を選択できません');toggleSub(s+'|add');return;
   }
   if(has(p,'青春の底力')&&p.youth>=3&&!G.study.boostSub){
    const options=[...new Set(current)].sort((a,b)=>current.filter(x=>x===b).length*aiLearnWeight(p,b)-current.filter(x=>x===a).length*aiLearnWeight(p,a));
    studyBoost(options[0]);return;
   }
   aiSay(p,`育成方針に従い${current.join('・')}を学習`);confirmStudy();return;
  }
  if(G.phase==='quiz'){
   // Advanced AI answers probabilistically, rather than peeking at the answer.
   const correct=Math.random()<0.76;quizDone(correct);return;
  }
  if(G.phase==='eventChoice'){
   let type=G.pendingTile?.type;
   if((type==='event'||type==='trait')&&aiTutorWanted(p)&&type==='event')eventChoice('tutor');
   else eventChoice('event');return;
  }
  if(G.phase==='traitDraw'){
   const newName=G.pendingDraw.name,old=p.trait,quality={ 'コツコツ型':5,'一夜漬け型':5.3,'気分屋':4.5,'本番に強い':4.8,'社交的':p.aiStyle==='youth'?7:4.2,'探究型':p.aiStyle==='national'?5.8:3.4};
   drawnTrait((quality[newName]||3)>(quality[old]||3)?'yes':'no');return;
  }
  if(G.phase==='cardReplace'){
   const incoming=G.pendingDraw?.name,values=p.cards.map(c=>aiCardValue(p,c.name)),worst=values.indexOf(Math.min(...values));
   const wanted=aiCardValue(p,incoming)>values[worst]+0.1;
   aiSay(p,wanted?`${incoming}を取得し手札を最適化`:`既存スキルを優先して${incoming}を破棄`);
   drawnCard(wanted?String(worst):'skip');return;
  }
  if(G.phase==='cardRankPick'){
   const s=aiBestSubject(p);aiSay(p,`${s}の成長ダイスを強化`);cardRankChoose(s);return;
  }
  if(G.phase==='cardTarget'){
   const name=G.pendingCard?.name;
   let target=aiTargetOpponent(p);
   if(['合同勉強会','模試の情報交換','文化祭の共同企画'].includes(name)){
    target=G.players.filter(x=>x.id!==p.id&&x.ai).sort((a,b)=>SUB.reduce((z,s)=>z+b.stats[s]-a.stats[s],0))[0]||G.players.find(x=>x.id!==p.id);
   }
   if(!target){cancelCard();return}cardTarget(String(target.id));return;
  }
  if(G.phase==='cardConsent'){consentCard(true);return}
  if(G.phase==='tutorPick'){let s=aiBestSubject(p);aiSay(p,`塾で${s}を追加学習`);takeTutor(s);return}
  if(G.phase==='afterStop'){
   if(aiPrepCard(p))return;
   if(aiTutorWanted(p)){requestTutor();return}
   finishStop();return;
  }
 }
 throw Error('AI処理が未対応の状態: '+G.screen+'/'+G.phase);
}

document.addEventListener('click',event=>{const b=event.target.closest('[data-act]');if(!b)return;event.preventDefault();
 const act=b.dataset.act;
 if(G?.aiMode&&aiCurrentActor()?.ai&&!['undo','aiPause','aiSpeed','help','cardsInfo','closeOverlay','settings','new','exportJson','exportCsv'].includes(act))return;
 const ignore=['undo','aiPause','aiSpeed','help','cardsInfo','closeOverlay','settings','new','start','resume','exportJson','exportCsv'];
 const before=G&&!ignore.includes(act)?JSON.stringify(G):null;
 if(before){UNDO_STACK.push(before);if(UNDO_STACK.length>UNDO_LIMIT)UNDO_STACK.shift();persistUndo()}
 dispatch(act,b.dataset.val??'');
 if(before&&JSON.stringify(G)===before){UNDO_STACK.pop();persistUndo();render()}});
document.addEventListener('change',event=>{let el=event.target;
 if(el.id==='setupOpponent'){SETUP.aiMode=el.value==='ai';SETUP.count=SETUP.aiMode?4:2;SETUP.names[0]=$('name0')?.value||SETUP.names[0];render()}
 else if(el.id==='setupCount'){SETUP.count=Number(el.value);for(let i=0;i<4;i++)SETUP.names[i]=$('name'+i)?.value||SETUP.names[i];render()}
 else if(el.id==='setupQuick'){SETUP.quick=el.value==='true';render()}
 else if(el.id==='boardView'){G.viewBoard=el.value||null;render()}
 else if(el.id==='uniFilter'){G.uniFilter=el.value;render()}
 else if(el.id==='mockFilter'&&G.mock){G.mock.filter=el.value;render()}
 else if(el.id==='mockSearch'&&G.mock){G.mock.search=el.value;render()}
 else if(el.id==='uniSearch'){G.uniSearch=el.value;render()}
 else if(el.id==='importSave'&&el.files?.length){let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(String(reader.result));if(![VERSION,'D-1.0-C','D-0.9-U6','D-0.8-U6'].includes(obj.version)||!Array.isArray(obj.players)||!obj.schoolCut)throw Error('この版で読み込めるセーブデータではありません');if(!confirm('現在のセーブを上書きして再開しますか？'))return;resetUndo();G=obj;G.version=VERSION;G.overlay=null;G.aiMode=!!G.aiMode;G.aiPaused=false;G.aiSpeed=G.aiSpeed||'fast';G.players.forEach(p=>p.ai=!!p.ai);save();render()}catch(err){alert('読み込み失敗：'+err.message)}};reader.readAsText(el.files[0])}
});
document.addEventListener('input',event=>{if(event.target.id?.startsWith('name')){const i=Number(event.target.id.slice(4));if(Number.isInteger(i))SETUP.names[i]=event.target.value}});
try{load()}catch(ex){}render();
